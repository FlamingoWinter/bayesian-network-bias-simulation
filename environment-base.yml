name: bayesian-network-bias-simulation
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - arviz
  - django>=5.1
  - django-cors-headers
  - matplotlib
  - numpy
  - pandas
  - pymc
  - scipy
  - sqlalchemy
  - xarray
  - pip
  - pip:
      # API / server
      - channels
      - daphne
      - redis
      - psycopg2-binary
      - python-dotenv
      # ML / data
      - scikit-learn
      - imbalanced-learn
      - torch
      - xgboost
      - cvxpy
      - pgmpy
      - networkx
      - statsmodels
      - pydantic
      # AI
      - google-generativeai
      # Dev tools
      - django-stubs
      - pyright
      - ruff
