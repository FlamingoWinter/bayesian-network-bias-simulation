version: '3'

vars:
  CONDA_ENV: bayesian-network-bias-simulation
  FRONTEND_DIR: frontend/bias-sim
  BACKEND_DIR: backend
  # Override with CONDA_ENV_FILE=environment_linux.yml task install-backend
  CONDA_ENV_FILE: '{{.CONDA_ENV_FILE | default "environment_macos.yml"}}'

tasks:

  # ── Dev servers ─────────────────────────────────────────────────────────────

  backend:
    desc: Run the Django dev server
    cmds:
      - conda run -n {{.CONDA_ENV}} --no-capture-output
        env PYTHONPATH={{.ROOT_DIR}} python backend/api/manage.py runserver

  frontend:
    desc: Run the Vite dev server
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm run dev

  # ── Setup ───────────────────────────────────────────────────────────────────

  install:
    desc: Install all dependencies (backend + frontend)
    deps: [install-backend, install-frontend]

  install-backend:
    desc: Create or update the conda environment
    cmds:
      - |
        OS=$(uname)
        if [ "$OS" != "Darwin" ] && [ -z "$CONDA_ENV_FILE" ]; then
          echo "Warning: this project was set up on macOS. You are on $OS."
          echo "The default env file is '{{.CONDA_ENV_FILE}}' — override with:"
          echo "  CONDA_ENV_FILE=environment_linux.yml task install-backend"
          echo ""
        fi
        if conda env list | grep -q "^{{.CONDA_ENV}} "; then
          echo "Environment '{{.CONDA_ENV}}' exists, updating from {{.CONDA_ENV_FILE}}..."
          conda env update -n {{.CONDA_ENV}} --file {{.CONDA_ENV_FILE}} --prune
        else
          echo "Creating environment '{{.CONDA_ENV}}' from {{.CONDA_ENV_FILE}}..."
          conda env create -n {{.CONDA_ENV}} --file {{.CONDA_ENV_FILE}}
        fi

  install-frontend:
    desc: Install npm dependencies
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm install

  # ── Code quality ─────────────────────────────────────────────────────────────

  lint:
    desc: Lint and type-check everything (frontend + backend)
    cmds:
      - task: lint-frontend
      - task: lint-backend

  fix:
    desc: Auto-fix formatting everywhere (frontend + backend)
    cmds:
      - task: fix-frontend
      - task: fix-backend

  lint-frontend:
    desc: Check frontend formatting (Prettier) and types (svelte-check)
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm run lint
      - npm run check

  fix-frontend:
    desc: Auto-fix frontend formatting (Prettier)
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm run format

  lint-backend:
    desc: Lint and type-check backend (ruff + pyright)
    cmds:
      - conda run -n {{.CONDA_ENV}} --no-capture-output ruff check {{.BACKEND_DIR}}
      - conda run -n {{.CONDA_ENV}} --no-capture-output ruff format --check {{.BACKEND_DIR}}
      - conda run -n {{.CONDA_ENV}} --no-capture-output pyright {{.BACKEND_DIR}}

  fix-backend:
    desc: Auto-fix backend linting and formatting (ruff)
    cmds:
      - conda run -n {{.CONDA_ENV}} --no-capture-output ruff check --fix {{.BACKEND_DIR}}
      - conda run -n {{.CONDA_ENV}} --no-capture-output ruff format {{.BACKEND_DIR}}

  # ── Environment management ───────────────────────────────────────────────────

  env-export:
    desc: Export conda env to {{.CONDA_ENV_FILE}}
    cmds:
      - conda env export -n {{.CONDA_ENV}} > {{.CONDA_ENV_FILE}}

  env-update:
    desc: Update conda env from {{.CONDA_ENV_FILE}}
    cmds:
      - conda env update -n {{.CONDA_ENV}} --file {{.CONDA_ENV_FILE}} --prune
